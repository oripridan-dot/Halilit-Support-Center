version: "3.9"

services:
  # =========================================================================
  # FastAPI Server — The only service needed for JIT architecture
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halilit_api
    ports:
      - "8000:8000"
    command: >
      uvicorn backend.server:app
      --host 0.0.0.0
      --port 8000
      --reload
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "INFO"
    volumes:
      - .:/app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
