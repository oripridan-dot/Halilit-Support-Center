# Conductor Daemon Configuration
# Controls behavior and features of the active Conductor

[daemon]
# Enable/disable the daemon
enabled = true

# Run mode: "background" (systemd/cron), "interactive" (CLI), "api" (HTTP server)
run_mode = "interactive"

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level = "INFO"

# Port for API mode (if enabled)
api_port = 8001

[file_watcher]
# Enable automatic file monitoring
enabled = true

# Debounce delay in seconds (prevents processing the same file too rapidly)
debounce_delay = 0.5

# Paths to watch (relative to project root)
watch_paths = [
    "backend/",
    "frontend/src/"
]

# File patterns to ignore
ignore_patterns = [
    "__pycache__",
    ".git",
    "node_modules",
    ".venv",
    ".pytest_cache",
    "*.pyc",
    "*.log",
    ".DS_Store",
    "dist",
    "build",
    ".next"
]

[standards]
# Enable auto-fixing of standards violations
auto_fix_enabled = true

# Rules to enforce
rules = [
    "react_component_rule",
    "python_type_hint_rule",
    "file_size_rule",
    "import_standardization_rule"
]

# Auto-fix severity levels: "none" (disabled), "auto" (fix silently), "warn" (notify then fix)
auto_fix_mode = "warn"

[agent_coordination]
# Enable Trinity Swarm agent coordination
enabled = true

# Default agent model
default_model = "gemini-2.0-flash"

# Agents to coordinate with
agents = [
    "CommercialScout",
    "OfficialVerifier",
    "ExternalValidator",
    "DevAgent",
    "MaintenanceOrchestrator"
]

[data_sync]
# Enable bi-directional data synchronization
enabled = true

# Sync direction: "both", "backend_to_frontend", "frontend_to_backend"
sync_direction = "both"

# Sync trigger: "auto" (on file change), "manual" (command only), "scheduled" (cron)
sync_trigger = "auto"

# Sync interval in seconds (for scheduled sync)
sync_interval = 300

# Data sources to sync
data_sources = [
    "brands",
    "products",
    "taxonomy",
    "specifications"
]

[ci_cd]
# Enable GitHub Actions integration
enabled = false

# GitHub token for auto-commit (set via environment)
github_token = "${GITHUB_TOKEN}"

# Auto-commit fixes
auto_commit = false

# Block merge if verification fails
block_on_failure = true

# Verification gates
verification_gates = [
    "spectrum_data_integrity",
    "code_standards",
    "type_safety",
    "test_coverage"
]

[performance]
# Event queue max size
event_queue_max_size = 1000

# Number of worker threads for event processing
worker_threads = 1

# Timeout for event processing in seconds
event_timeout = 30

# Max log file size in MB
max_log_size = 100

[features]
# Natural language command interface
nlp_commands = true

# Dashboard UI for monitoring
dashboard = false

# Slack integration for notifications
slack_integration = false

# Email alerts for critical issues
email_alerts = false
