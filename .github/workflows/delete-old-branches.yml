name: Delete Old Branches

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE" to confirm branch deletion'
        required: true
        default: ''

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'
    permissions:
      contents: write  # Required to delete branches
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Delete branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Starting Branch Cleanup ==="
          echo "Branches to keep: main, v8.4, v8.6"
          echo ""
          
          # Array of branches to delete
          branches_to_delete=(
            "copilot/fix-codespace-start-issue"
            "copilot/update-devcontainer-settings"
            "v4.0"
            "v4.1-3d"
            "v4.6.1"
            "v5.0"
            "v5.1-taxonomy"
            "v5.2-adk"
            "v5.2.4-google-conductor"
            "v5.4"
            "v6.0"
            "v6.1.1"
            "v8.0"
            "v8.3-mcp"
            "v8.5"
          )
          
          deleted_count=0
          failed_count=0
          
          for branch in "${branches_to_delete[@]}"; do
            echo "Attempting to delete branch: $branch"
            
            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/git/refs/heads/$branch" 2>&1; then
              echo "✓ Successfully deleted: $branch"
              ((deleted_count++))
            else
              echo "✗ Failed to delete: $branch"
              ((failed_count++))
            fi
            echo ""
          done
          
          echo "=== Branch Cleanup Summary ==="
          echo "Deleted: $deleted_count branches"
          echo "Failed: $failed_count branches"
          echo ""
          echo "Remaining branches:"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/branches" \
            --jq '.[].name' | sort
          
          echo ""
          echo "Note: Branch 'copilot/delete-unwanted-branches' should be deleted after PR merge"
      
      - name: Verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Final Verification ==="
          branch_count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/branches" \
            --jq '. | length')
          
          echo "Total branches remaining: $branch_count"
          echo "Expected: 4 (main, v8.4, v8.6, copilot/delete-unwanted-branches)"
          
          if [ "$branch_count" -eq 4 ]; then
            echo "✓ Branch cleanup successful!"
          else
            echo "⚠ Unexpected branch count. Please verify manually."
          fi
